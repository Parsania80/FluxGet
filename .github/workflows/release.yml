name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'media/**'
      - 'internal/buildinfo/**'
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: Verify and package ${{ matrix.platform }} amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version and formatting
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must have the form vMAJOR.MINOR.PATCH, for example v1.0.0.' >&2
            exit 1
          fi
          version=$(tr -d '\r\n' < internal/buildinfo/version.txt)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag does not match the source version.' >&2
            exit 1
          fi
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          node --test extensions/core.test.cjs
          python -m py_compile packaging/build_release.py packaging/build_deb.py packaging/build_browser_extensions.py packaging/install_browser_bridge.py packaging/verify_media_setup.py
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libdecor-0-dev
      - name: Windows compiler
        if: runner.os == 'Windows'
        run: |
          gcc --version
          windres --version
      - name: Linux engine and desktop suites
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 ./...
          go vet ./...
          cd desktop
          go test -race -count=1 ./...
          go vet ./...
      - name: Native Windows regression checks
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -count=1 -v -run '^(TestWindows|TestSorted|TestMediaTool)' ./... 2>&1 | tee "$RUNNER_TEMP/fluxget-windows-tests.log"
          go vet ./...
          cd desktop
          go test -race -tags ci -count=1 -v -run '^(TestDownloadUsesExistingCLI|TestPausedDownloadCanResume|TestDesktopQueueUsesPersistentCLIScheduler|TestProxy|TestYouTube|TestUnifiedSorted|TestSpeedSettingsPersist|TestSettingsUnitSelector)' . 2>&1 | tee -a "$RUNNER_TEMP/fluxget-windows-tests.log"
          go vet -tags ci ./...
      - name: Build native installer
        env:
          CGO_LDFLAGS: ${{ runner.os == 'Windows' && '-static' || '' }}
        run: python packaging/build_release.py --platform '${{ matrix.platform }}' 2>&1 | tee "$RUNNER_TEMP/fluxget-build.log"
      - name: Verify Debian package installation
        if: runner.os == 'Linux'
        run: |
          version=$(tr -d '\r\n' < internal/buildinfo/version.txt)
          package="$GITHUB_WORKSPACE/dist/release/fluxget_${version}_amd64.deb"
          dpkg-deb --info "$package"
          sudo dpkg -i "$package"
          test "$(fluxget -version)" = "FluxGet $version"
          test -x /opt/fluxget/fluxget-gui
          ldd /opt/fluxget/fluxget-gui | tee "$RUNNER_TEMP/fluxget-runtime-libraries.txt"
          if grep -q 'not found' "$RUNNER_TEMP/fluxget-runtime-libraries.txt"; then exit 1; fi
          test -f /etc/opt/chrome/native-messaging-hosts/io.github.parsania80.fluxget.json
          python packaging/verify_media_setup.py --engine /opt/fluxget/fluxget
          sudo dpkg -r fluxget
          test ! -e /opt/fluxget/fluxget
          test ! -e /etc/opt/chrome/native-messaging-hosts/io.github.parsania80.fluxget.json
      - name: Verify Windows setup installation and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content internal/buildinfo/version.txt).Trim()
          $setup = Join-Path $PWD "dist/release/fluxget-$version-windows-amd64-setup.exe"
          $target = Join-Path $env:RUNNER_TEMP 'FluxGet install test'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed with exit code $($process.ExitCode)" }
          if ((& "$target/fluxget.exe" -version) -ne "FluxGet $version") { throw 'Installed version mismatch' }
          $manifest = Get-Content "$target/native-chrome.json" | ConvertFrom-Json
          if ($manifest.path -ne "$target\fluxget-native-chrome.exe") { throw 'Native host path mismatch' }
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Setup repair failed' }
          if (-not (Test-Path "$target/extensions/chrome/manifest.json")) { throw 'Repair lost extension files' }
          python packaging/verify_media_setup.py --engine "$target/fluxget.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed YouTube setup or native media acceptance failed' }
          $process = Start-Process -FilePath "$target/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path "$target/fluxget.exe") { throw 'Uninstall left application executable' }
          if (Test-Path 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\io.github.parsania80.fluxget') { throw 'Uninstall left native host registered' }
      - name: Report build or test errors
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for filename in ('fluxget-windows-tests.log', 'fluxget-build.log'):
              path = Path(os.environ['RUNNER_TEMP']) / filename
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  chosen = [line for line in lines if 'FAIL' in line or '.go:' in line or 'Error' in line]
                  message = '\n'.join(chosen or lines[-30:])[-10000:]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Release verification details::' + message)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-amd64
          path: |
            dist/release/*.deb
            dist/release/*-setup.exe
            dist/release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish both platforms together
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    concurrency:
      group: fluxget-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < internal/buildinfo/version.txt)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; nothing will be replaced.'
            exit 0
          fi
          cd release-assets
          test -f "fluxget_${version}_amd64.deb"
          test -f "fluxget-$version-windows-amd64-setup.exe"
          sha256sum -c *.sha256
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "FluxGet $tag" --notes-file "$GITHUB_WORKSPACE/packaging/RELEASE-NOTES.md"
