name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and package ${{ matrix.platform }} amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version and formatting
        run: |
          version=$(tr -d '\r\n' < internal/buildinfo/version.txt)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag does not match the source version.' >&2
            exit 1
          fi
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          node --test extensions/core.test.cjs
          python -m py_compile packaging/build_release.py packaging/build_browser_extensions.py packaging/install_browser_bridge.py
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libdecor-0-dev
      - name: Windows compiler
        if: runner.os == 'Windows'
        run: |
          gcc --version
          windres --version
      - name: Linux engine and desktop suites
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 ./...
          go vet ./...
          cd desktop
          go test -race -count=1 ./...
          go vet ./...
      - name: Native Windows regression checks
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -count=1 -run '^TestWindows' ./...
          go vet ./...
          cd desktop
          go test -race -count=1 -run '^(TestDownloadUsesExistingCLI|TestPausedDownloadCanResume|TestDesktopQueueUsesPersistentCLIScheduler)$' .
          go vet ./...
      - name: Build release archive
        env:
          CGO_LDFLAGS: ${{ runner.os == 'Windows' && '-static' || '' }}
        run: python packaging/build_release.py --platform '${{ matrix.platform }}'
      - name: Verify packaged Linux installation
        if: runner.os == 'Linux'
        run: |
          stage="$GITHUB_WORKSPACE/dist/release/stage/fluxget-$(tr -d '\n' < internal/buildinfo/version.txt)-linux-amd64"
          sandbox=$(mktemp -d)
          HOME="$sandbox" XDG_CONFIG_HOME="$sandbox/.config" sh "$stage/install.sh"
          "$sandbox/.local/opt/fluxget/fluxget" -version
          HOME="$sandbox" XDG_CONFIG_HOME="$sandbox/.config" sh "$sandbox/.local/opt/fluxget/uninstall.sh"
          test ! -e "$sandbox/.config/google-chrome/NativeMessagingHosts/io.github.parsania80.fluxget.json"
      - name: Verify packaged Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content internal/buildinfo/version.txt).Trim()
          $stage = Join-Path $PWD "dist/release/stage/fluxget-$version-windows-amd64"
          $target = Join-Path $env:RUNNER_TEMP 'FluxGet install test'
          & "$stage/install.ps1" -InstallDir $target
          if ((& "$target/fluxget.exe" -version) -ne "FluxGet $version") { throw 'Installed version mismatch' }
          $manifest = Get-Content "$target/native-chrome.json" | ConvertFrom-Json
          if ($manifest.path -ne "$target\fluxget-native-chrome.exe") { throw 'Native host path mismatch' }
          & "$stage/install.ps1" -InstallDir $target
          if (-not (Test-Path "$target/extensions/chrome/manifest.json")) { throw 'Repair lost extension files' }
          & "$target/uninstall.ps1"
          if (Test-Path 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\io.github.parsania80.fluxget') { throw 'Uninstall left native host registered' }
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-amd64
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish both platforms together
    # The operator authorized the first v1.0.0 release; later versions require a tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    concurrency:
      group: fluxget-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < internal/buildinfo/version.txt)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; nothing will be replaced.'
            exit 0
          fi
          tag_args=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # Bootstrap only the explicitly requested first release from main.
            [[ "$version" == 1.0.0 ]] || exit 0
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              echo 'A newer main commit exists; leave publication to its checks.'
              exit 0
            fi
            existing_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)
            if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
              echo 'Existing release tag points elsewhere; refusing to replace it.' >&2
              exit 1
            fi
            tag_args=(--target "$GITHUB_SHA")
          fi
          cd release-assets
          test -f "fluxget-$version-linux-amd64.tar.gz"
          test -f "fluxget-$version-windows-amd64.zip"
          sha256sum -c *.sha256
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" "${tag_args[@]}" --title "FluxGet $tag" --notes-file "$GITHUB_WORKSPACE/packaging/RELEASE-NOTES.md"
