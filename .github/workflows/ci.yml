name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  media:
    name: Media and proxy checks ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Provision checksum-locked development tools
        run: python packaging/setup_media_tools.py --directory "$RUNNER_TEMP/fluxget-media-tools"
      - name: Native media contract and generated media acceptance
        run: |
          export FLUXGET_MEDIA_TOOLS="$RUNNER_TEMP/fluxget-media-tools/tools.json"
          go test -race -count=1 -v ./media ./networkproxy
          go test -race -count=1 -v -run '^(TestQueueProxy|TestProxyRoute|TestStandaloneCLIProxy|TestBrowserProxy|TestMediaQueue)' .
          go vet ./media ./networkproxy ./cmd/fluxget-media-spike
          go run ./cmd/fluxget-media-spike -tools "$FLUXGET_MEDIA_TOOLS" -mode probe
      - name: Native proxy and YouTube desktop controls
        working-directory: desktop
        run: |
          if go test -race -tags ci -count=1 -v -run '^(TestProxy|TestYouTube)' . > "$RUNNER_TEMP/fluxget-desktop-controls.log" 2>&1; then
            cat "$RUNNER_TEMP/fluxget-desktop-controls.log"
          else
            cat "$RUNNER_TEMP/fluxget-desktop-controls.log"
            python - <<'PY'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'fluxget-desktop-controls.log').read_text(errors='replace').splitlines()
          chosen = [line for line in lines if 'FAIL' in line or '.go:' in line or 'Error' in line]
          message = '\n'.join(chosen or lines[-30:])[-10000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Native desktop verification details::' + message)
          PY
            exit 1
          fi

  linux:
    name: Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Browser extension logic
        run: node --test extensions/core.test.cjs
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -v ./...
      - name: Build Linux executable
        run: go build -o "$RUNNER_TEMP/fluxget" .
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Test and build desktop app
        working-directory: desktop
        run: |
          go test -race -count=1 ./...
          go build -o "$RUNNER_TEMP/fluxget-gui" .
      - name: Check Windows and macOS cross-builds
        run: |
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/fluxget.exe" .
          GOOS=darwin GOARCH=amd64 go build -o "$RUNNER_TEMP/fluxget-darwin" .
